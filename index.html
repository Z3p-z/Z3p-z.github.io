<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Web Aim Trainer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: monospace; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; border: 2px solid #00ff00; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5,5,10,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; text-align: center; }
        .box { background: #111827; padding: 30px; border: 2px solid #f59e0b; border-radius: 4px; max-width: 450px; box-shadow: 0 0 20px rgba(245,158,11,0.2); }
        button { background: #f59e0b; color: black; border: none; padding: 14px 28px; font-size: 1.2rem; cursor: pointer; font-family: monospace; font-weight: bold; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #d97706; }
        #hud { position: absolute; bottom: 20px; left: 20px; font-size: 1.5rem; z-index: 10; color: #f59e0b; text-shadow: 2px 2px #000; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 4px; border: 1px solid #475569; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hud">SCORE: <span id="kill-count">0</span></div>

    <div id="ui-overlay">
        <div class="box">
            <h2>Tactical Aim Trainer</h2>
            <p>Klicke auf den Button, um dein Aiming zu trainieren. Schieße auf die grünen Sphären.</p>
            <button id="btn-start">Training Starten</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, raycaster;
        let targets = [];
        let mouse = new THREE.Vector2(0, 0);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        let score = 0;

        function createGridTexture(color1, color2, size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1;
            ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = color2;
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        function createBoxTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 120, 120);
            ctx.beginPath();
            ctx.moveTo(8, 8); ctx.lineTo(120, 120);
            ctx.moveTo(120, 8); ctx.lineTo(8, 120);
            ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        document.getElementById('btn-start').onclick = () => {
            startGame();
        };

        function startGame() {
            document.getElementById('ui-overlay').style.display = 'none';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 10);
            camera.rotation.order = 'YXZ';

            raycaster = new THREE.Raycaster();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 30, 10);
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(100, 100);
            floorGeo.rotateX(-Math.PI / 2);
            const floorTex = createGridTexture('#1e293b', '#334155', 64);
            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(40, 40);
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            scene.add(floor);

            const boxTex = createBoxTexture();
            const boxMat = new THREE.MeshStandardMaterial({ map: boxTex, roughness: 0.7 });
            const wallGeo = new THREE.BoxGeometry(60, 20, 2);
            const backWall = new THREE.Mesh(wallGeo, boxMat);
            backWall.position.set(0, 10, -20);
            scene.add(backWall);

            for (let i = 0; i < 5; i++) {
                spawnTarget();
            }

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', shoot);
            window.addEventListener('resize', onWindowResize);

            document.body.requestPointerLock();
            animate();
        }

        function spawnTarget() {
            const targetGeo = new THREE.SphereGeometry(0.6, 32, 32);
            const targetMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ff66, 
                emissive: 0x003311,
                roughness: 0.2, 
                metalness: 0.5 
            });
            const mesh = new THREE.Mesh(targetGeo, targetMat);
            
            mesh.position.set(
                Math.random() * 24 - 12,
                Math.random() * 8 + 1.5,
                -18
            );
            
            scene.add(mesh);
            targets.push(mesh);
        }

        function onMouseMove(e) {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.0012;
                camera.rotation.x -= e.movementY * 0.0012;
                camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera.rotation.x));
            }
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function shoot(e) {
            if (document.pointerLockElement !== document.body || e.button !== 0) return;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(targets);

            let targetEnd = new THREE.Vector3();
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            if (hits.length > 0) {
                const hitObject = hits[0].object;
                targetEnd.copy(hits[0].point);

                scene.remove(hitObject);
                targets = targets.filter(t => t !== hitObject);
                
                score++;
                document.getElementById('kill-count').innerText = score;

                setTimeout(spawnTarget, 200);
            } else {
                targetEnd.copy(camera.position).add(dir.multiplyScalar(50));
            }

            spawnVisualTracer(camera.position, targetEnd);
        }

        function spawnVisualTracer(startPos, endPos) {
            const start = startPos.clone().add(new THREE.Vector3(0, -0.1, 0));
            const points = [start, endPos.clone()];
            const tracerGeo = new THREE.BufferGeometry().setFromPoints(points);
            const tracerMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
            const tracer = new THREE.Line(tracerGeo, tracerMat);
            scene.add(tracer);
            setTimeout(() => scene.remove(tracer), 50);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === document.body) {
                velocity.x -= velocity.x * 12.0 * delta;
                velocity.z -= velocity.z * 12.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 140.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 140.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y = 1.6;
            }

            targets.forEach((target, index) => {
                target.position.y += Math.sin(time * 0.003 + index) * 0.005;
            });

            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        document.getElementById('canvas-container').addEventListener('click', () => {
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });
    </script>
</body>
</html>
