<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --bg: #090d16;
        --card-bg: #111827;
        --accent-cyan: #38bdf8;
        --accent-purple: #a855f7;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #1e293b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6;
        padding: 2rem 1rem;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 550px;
        width: 100%;
        text-align: center;
      }

      .error-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 3rem 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .error-code {
        font-size: 5rem;
        font-weight: 900;
        background: linear-gradient(
          135deg,
          var(--accent-cyan),
          var(--accent-purple)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 1rem;
        letter-spacing: -2px;
      }

      .icon-wrapper {
        font-size: 2.5rem;
        color: var(--accent-cyan);
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.8rem;
      }

      p {
        color: var(--text-muted);
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(56, 189, 248, 0.1);
        color: var(--accent-cyan);
        border: 1px solid rgba(56, 189, 248, 0.25);
        padding: 0.75rem 1.4rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background: var(--accent-cyan);
        color: #090d16;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--border);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-card">
        <div class="icon-wrapper">
          <i class="fa-solid fa-ghost"></i>
        </div>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The path you are looking for doesn't exist or has been moved.</p>

        <div class="actions">
          <a href="/" class="btn"> <i class="fa-solid fa-house"></i> Home </a>
          <a href="/music/" class="btn btn-secondary">
            <i class="fa-brands fa-spotify"></i> Music Vault
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
