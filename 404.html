<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0b0f19;
            color: #f59e0b;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        .error-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .number {
            color: #f59e0b;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .paper-skribbl {
            width: clamp(60px, 12vw, 110px);
            height: clamp(80px, 16vw, 150px);
            border: 3px solid #f59e0b;
            border-radius: 4px;
            position: relative;
            background: transparent;
            box-shadow: 4px 4px 0px #d97706;
            display: inline-block;
            transform: rotate(-3deg);
            animation: float 4s ease-in-out infinite;
        }

        .paper-skribbl::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20px 20px 0;
            border-color: transparent transparent #0b0f19 #0b0f19;
            background: #f59e0b;
            box-shadow: -2px 2px 0px #d97706;
        }

        .lines {
            padding: 30px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .line {
            height: 3px;
            background-color: #f59e0b;
            border-radius: 2px;
            opacity: 0.8;
        }

        .line:nth-child(1) { width: 70%; }
        .line:nth-child(2) { width: 85%; }
        .line:nth-child(3) { width: 50%; }
        .line:nth-child(4) { width: 65%; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        h1 {
            font-size: 1.5rem;
            color: #fff;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .btn-back {
            display: inline-block;
            background: transparent;
            color: #f59e0b;
            border: 2px solid #f59e0b;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: monospace;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px #d97706;
        }

        .btn-back:hover {
            background: #f59e0b;
            color: #0b0f19;
            box-shadow: 0px 0px 0px transparent;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">
            <span class="number">4</span>
            <div class="paper-skribbl">
                <div class="lines">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
            </div>
            <span class="number">4</span>
        </div>
        
        <h1>Ziel verfehlt!</h1>
        <p>Diese Seite gibt es nicht! Lobby-Code richtig?</p>
        
        <a href="/" class="btn-back">Zurück zum Hauptmenü</a>
    </div>

</body>
</html>
